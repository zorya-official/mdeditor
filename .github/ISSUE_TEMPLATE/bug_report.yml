name: Bug report
description: Something in MD Editor doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Issues are public, so please don't paste or attach private documents. A short sample that shows the problem is enough.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - Mac
        - iPhone
        - iPad
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: For example 1.0.2. Leave it empty if you're not sure.
  - type: input
    id: os
    attributes:
      label: System version
      description: For example Windows 11, Android 15 or macOS 15.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open a .md file with a table
        2. Switch to Preview
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: sample
    attributes:
      label: Sample Markdown (optional)
      description: A few lines that show the problem. Nothing private.
      render: markdown
